name: AI review check

on:
  workflow_run:
    workflows: [AI review]
    types: [in_progress, completed]

permissions: {}

# 開始と完了を直列化する。元のAIレビューのキャンセルには巻き込まれない。
concurrency:
  group: ai-review-check-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
  queue: max

jobs:
  notify:
    if: >-
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/ai-review.yml' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Download bounded status reports from this attempt
        id: reports
        if: github.event.action == 'completed'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: ai-review-status-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-*
          path: ${{ runner.temp }}/ai-review-status
      - name: Update the check on the reviewed PR revision
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: ${{ github.event.workflow_run.id }}
          REVIEW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REVIEW_RUN_PHASE: ${{ github.event.action }}
          REVIEW_REPORT_DIRECTORY: ${{ runner.temp }}/ai-review-status
          REVIEW_REPORT_DOWNLOAD: ${{ steps.reports.outcome }}
        run: node tools/ai-review/check-status.ts
