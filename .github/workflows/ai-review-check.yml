name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ai-review-display-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review result
    if: >-
      vars.AI_REVIEW_MODE == 'review' &&
      github.event.pull_request.user.id == 1324680 &&
      github.event.pull_request.user.type == 'User' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      REVIEW_SINCE: ${{ github.event.pull_request.updated_at }}
      REVIEW_PR: ${{ github.event.pull_request.number }}
      REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
      REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Wait for trusted AI review execution
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ai-review/wait-review.ts wait
      - name: Download bounded status reports from this attempt
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.wait.outputs.run }}
          pattern: ai-review-status-${{ steps.wait.outputs.run }}-${{ steps.wait.outputs.attempt }}-*
          path: ${{ runner.temp }}/ai-review-status
      - name: Show verified review result
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: ${{ steps.wait.outputs.run }}
          REVIEW_RUN_ATTEMPT: ${{ steps.wait.outputs.attempt }}
          REVIEW_REPORT_DIRECTORY: ${{ runner.temp }}/ai-review-status
          REVIEW_REPORT_DOWNLOAD: ${{ steps.reports.outcome }}
        run: node tools/ai-review/wait-review.ts finish
