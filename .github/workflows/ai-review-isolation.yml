name: AI review isolation acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    name: Verify official isolation with dummy credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: openai/codex-action
          ref: bdf19a4a223ec2549a3e2274a0cf61556bc07675
          path: .official-codex-action
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Compile trusted acceptance fixture
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir tools/ai-review exec tsc --ignoreConfig --types node \
            isolation-probe.ts isolation/action-probe.ts isolation/probe-child.ts isolation/run.ts isolation/startup.ts \
            --module NodeNext --target ES2022 --skipLibCheck --outDir "$RUNNER_TEMP/isolation-compiled"
      - name: Install pinned official CLI and OS tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/openai/codex/releases/download/rust-v0.164.0/codex-x86_64-unknown-linux-musl.tar.gz \
            -o "$RUNNER_TEMP/codex.tar.gz"
          echo "90dd0b03b28afcb7fa733a4f73b413db2916a47347efd43fb669cc1c774ee8e4  $RUNNER_TEMP/codex.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/codex.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/codex-x86_64-unknown-linux-musl" /usr/local/bin/codex
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # 公式Actionと同じuser namespace条件。PRコマンドの権限を緩める設定ではない。
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test official user switch and read-only sandbox
        run: |
          sudo bash tools/ai-review/isolation/setup.sh \
            "$GITHUB_WORKSPACE/.official-codex-action/dist/main.js" \
            "$RUNNER_TEMP/isolation-compiled" github
      - name: Verify untrusted PR startup without external network
        run: |
          # モデルの代わりに400を返すローカル受信器だけを使う。外部通信経路を作らない。
          sudo unshare --net bash -c 'ip link set lo up; exec /usr/local/bin/node /opt/ai-review-probe/startup.js "$1"' \
            bash "$GITHUB_WORKSPACE/.official-codex-action/dist/main.js"
