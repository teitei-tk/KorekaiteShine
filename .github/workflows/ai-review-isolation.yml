# 検証専用ブランチ限定。本番コードはmainのマージコミットへ固定する。
name: AI review isolation acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    name: Verify runtime diagnostic (${{ matrix.failure }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        failure: [preflight, metadata, pr-copy]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: cc3a2327e24b14d8a711534a20dd3a01c150cc11
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Compile pinned production runtime
        run: |
          test "$(git rev-parse HEAD)" = cc3a2327e24b14d8a711534a20dd3a01c150cc11
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir tools/ai-review exec tsc --ignoreConfig --types node runtime.ts \
            --rewriteRelativeImportExtensions --module NodeNext --target ES2022 --skipLibCheck \
            --outDir "$RUNNER_TEMP/isolation-compiled"
      - name: Exercise actual failure and verify persisted diagnostic
        env:
          FAILURE_CASE: ${{ matrix.failure }}
          AI_REVIEW_JOB: generate
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdirSync, writeFileSync, readFileSync, copyFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { recordExecutionFailure, readStatusReports } from './tools/ai-review/status-report.ts';
          const { FAILURE_CASE: failure, RUNNER_TEMP: temp, GITHUB_STEP_SUMMARY: summary } = process.env;
          assert.notEqual(process.getuid(), 0);
          const directory = join(temp, 'SECRET_SENTINEL_input');
          mkdirSync(directory);
          writeFileSync(join(directory, 'metadata.json'), failure === 'metadata' ? 'SECRET_SENTINEL invalid JSON' : JSON.stringify({
            version: 2, repository: 'teitei-tk/KorekaiteShine', number: 51,
            head: 'a'.repeat(40), base: 'b'.repeat(40), sourceRun: '1', lines: {},
            history: { issues: [], inline: [], threads: [] },
          }));
          const env = Object.fromEntries(['PATH', 'RUNNER_TEMP', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'AI_REVIEW_JOB', 'GITHUB_STEP_SUMMARY'].map(key => [key, process.env[key]]));
          const args = [join(temp, 'isolation-compiled/runtime.js'), 'setup', directory, process.cwd()];
          const result = failure === 'preflight'
            ? spawnSync(process.execPath, args, { env, encoding: 'utf8' })
            : spawnSync('sudo', ['--preserve-env=RUNNER_TEMP,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,AI_REVIEW_JOB,GITHUB_STEP_SUMMARY', process.execPath, ...args], { env, encoding: 'utf8' });
          assert.equal(result.status, 1);
          assert.equal(result.signal, null);
          const target = failure === 'preflight' ? 'runtime/preflight' : `setup/${failure}`;
          const expected = `公式レビュー未完了: ${target}。\n`;
          assert.equal(result.stderr, expected);
          assert.equal(result.stdout, '');
          assert.equal(readFileSync(summary, 'utf8'), expected);
          const path = join(temp, 'status.json');
          const before = readFileSync(path, 'utf8');
          recordExecutionFailure(process.env);
          assert.equal(readFileSync(path, 'utf8'), before);
          const [report] = readStatusReports(temp, Number(env.GITHUB_RUN_ID), Number(env.GITHUB_RUN_ATTEMPT));
          assert.equal(report.target, target);
          assert.equal(report.reason, 'EXECUTION_FAILED');
          assert.equal(report.status, 'failure');
          assert.equal(report.job, 'generate');
          assert.ok(!before.includes('SECRET_SENTINEL'));
          const evidence = join(temp, 'diagnostic-evidence');
          mkdirSync(evidence);
          copyFileSync(path, join(evidence, 'status.json'));
          copyFileSync(summary, join(evidence, 'summary.md'));
          writeFileSync(join(evidence, 'verification.json'), JSON.stringify({
            productionSha: 'cc3a2327e24b14d8a711534a20dd3a01c150cc11', failure, target,
            exitCode: result.status, summaryVerified: true, fallbackPreserved: true, sentinelAbsent: true,
          }));
          console.log(`Verified ${target}: exit=1, status, summary, fallback, no external error text`);
          NODE
      - name: Preserve verified evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: runtime-diagnostic-${{ matrix.failure }}-${{ github.run_id }}
          path: ${{ runner.temp }}/diagnostic-evidence
          if-no-files-found: error
          retention-days: 7
