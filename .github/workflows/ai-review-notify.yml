name: AI review failure notification

on:
  workflow_run:
    workflows: [AI review execution]
    types: [completed]

permissions: {}

concurrency:
  group: ai-review-notify-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.repository.id == github.event.repository.id &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      REVIEW_RUN_ID: ${{ github.event.workflow_run.id }}
      REVIEW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Validate trusted execution and current PR before notification
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ai-review/failure-notify.ts prepare
      - uses: actions/download-artifact@v8.0.2
        id: reports
        if: steps.target.outputs.allowed == 'true'
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: ai-review-status-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-*
          path: ${{ runner.temp }}/ai-review-notify-reports
      - name: Notify review failure without model output or secrets
        if: always() && steps.target.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPORT_DOWNLOAD: ${{ steps.reports.outcome }}
          REVIEW_REPORT_DIRECTORY: ${{ runner.temp }}/ai-review-notify-reports
        run: node tools/ai-review/failure-notify.ts publish
