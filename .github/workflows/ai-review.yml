name: AI review execution
run-name: AI review / source run ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }} / ${{ vars.AI_REVIEW_MODE }}

on:
  workflow_run:
    workflows: [Documentation checks]
    types: [completed]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  # 指定されたmainのCIだけを検証する。通常レビューはoffのまま。
  wif-validation:
    if: >-
      vars.AI_REVIEW_MODE == 'off' &&
      ((vars.AI_REVIEW_WIF_PROBE_RUN != '' && vars.AI_REVIEW_WIF_PROBE_RUN == format('{0}', github.event.workflow_run.id)) ||
       (vars.AI_REVIEW_WIF_MODEL_RUN != '' && vars.AI_REVIEW_WIF_MODEL_RUN == format('{0}', github.event.workflow_run.id))) &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.repository.id == 1426899426 &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: openai/codex-action
          ref: bdf19a4a223ec2549a3e2274a0cf61556bc07675
          path: .official-codex-action
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prepare trusted isolation verification
        run: bash tools/ai-review/isolation/prepare.sh
      - name: Verify real WIF authentication without model requests
        if: vars.AI_REVIEW_WIF_MODEL_RUN != format('{0}', github.event.workflow_run.id)
        env:
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
        run: |
          sudo --preserve-env=ACTIONS_ID_TOKEN_REQUEST_TOKEN,ACTIONS_ID_TOKEN_REQUEST_URL,OPENAI_WIF_AUDIENCE,OPENAI_IDENTITY_PROVIDER_ID,OPENAI_SERVICE_ACCOUNT_ID \
            /usr/local/bin/node "$RUNNER_TEMP/isolation-compiled/isolation/wif.js"

      - name: Start official WIF proxy for expiry verification
        id: model-prepare
        if: vars.AI_REVIEW_WIF_MODEL_RUN == format('{0}', github.event.workflow_run.id)
        env:
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
        run: |
          sudo --preserve-env=ACTIONS_ID_TOKEN_REQUEST_TOKEN,ACTIONS_ID_TOKEN_REQUEST_URL,OPENAI_WIF_AUDIENCE,OPENAI_IDENTITY_PROVIDER_ID,OPENAI_SERVICE_ACCOUNT_ID \
            /usr/local/bin/node "$RUNNER_TEMP/isolation-compiled/isolation/model.js" prepare "$GITHUB_RUN_ID"
      - name: Wait past maximum token lifetime and verify closed renewal failure
        id: model-expiry
        if: steps.model-prepare.outcome == 'success'
        timeout-minutes: 65
        run: sudo /usr/local/bin/node "$RUNNER_TEMP/isolation-compiled/isolation/model.js" wait
      - name: Verify model and Schema with official Action
        id: wif-model
        if: steps.model-expiry.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: openai/codex-action@v1.13
        with:
          codex-version: 0.164.0
          openai-api-key: ''
          allow-users: ${{ github.actor }}
          prompt: 'Return exactly {"status":"ok"} for this connection test. Do not use tools or read files.'
          output-schema: '{"type":"object","properties":{"status":{"type":"string","enum":["ok"]}},"required":["status"],"additionalProperties":false}'
          model: gpt-6-luna
          effort: medium
          working-directory: /opt/ai-review-probe/pr
          codex-home: /home/ai-review/.codex
          safety-strategy: unprivileged-user
          codex-user: ai-review
          sandbox: read-only
          codex-args: '["--ephemeral"]'
      - name: Verify renewal evidence and stop official WIF proxy
        if: ${{ always() && steps.model-prepare.outcome == 'success' }}
        env:
          MODEL_OUTCOME: ${{ steps.wif-model.outcome }}
          MODEL_OUTPUT: ${{ steps.wif-model.outputs.final-message }}
        run: |
          sudo --preserve-env=MODEL_OUTPUT /usr/local/bin/node "$RUNNER_TEMP/isolation-compiled/isolation/model.js" finish "$MODEL_OUTCOME"

  gate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      (vars.AI_REVIEW_MODE == 'claims' || vars.AI_REVIEW_MODE == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AI_REVIEW_JOB: gate
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      pr: ${{ steps.gate.outputs.pr }}
      head: ${{ steps.gate.outputs.head }}
      base: ${{ steps.gate.outputs.base }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Check PR author and CI revision before authentication
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node tools/ai-review/prepare.ts gate
      - name: Preserve check status
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ai-review-status-${{ github.run_id }}-${{ github.run_attempt }}-gate
          path: ${{ runner.temp }}/status.json
          if-no-files-found: ignore
          retention-days: 1

  generate:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      ready: ${{ steps.validate.outcome == 'success' }}
      artifact: ${{ steps.review.outputs.artifact }}
      attempt: ${{ steps.review.outputs.attempt }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
    env:
      AI_REVIEW_JOB: generate
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      AI_REVIEW_MODE: ${{ vars.AI_REVIEW_MODE }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
        if: vars.AI_REVIEW_MODE == 'review'
        with:
          package_json_file: package.json
      - name: Install trusted review dependencies before authentication
        if: vars.AI_REVIEW_MODE == 'review'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Keep the repository Node version for validation
        run: |
          echo "REVIEW_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "REVIEW_DIRECTORY=$RUNNER_TEMP/ai-review-material" >> "$GITHUB_ENV"
      - name: Recheck target and collect inert text without executing PR code
        id: material
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ai-review/prepare.ts collect
      - name: Confirm target is still the one accepted by the gate
        if: steps.material.outputs.allowed == 'true'
        env:
          EXPECTED_HEAD: ${{ needs.gate.outputs.head }}
          EXPECTED_BASE: ${{ needs.gate.outputs.base }}
          ACTUAL_HEAD: ${{ steps.material.outputs.head }}
          ACTUAL_BASE: ${{ steps.material.outputs.base }}
        run: test "$EXPECTED_HEAD" = "$ACTUAL_HEAD" && test "$EXPECTED_BASE" = "$ACTUAL_BASE"
      - name: Diagnose claims or exchange a short-lived token
        id: wif
        if: steps.material.outputs.allowed == 'true' && vars.AI_REVIEW_MODE == 'claims'
        env:
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
        run: node tools/ai-review/wif.ts
      - name: Review using GPT-6 Luna
        id: review
        if: steps.material.outputs.allowed == 'true' && vars.AI_REVIEW_MODE == 'review'
        timeout-minutes: 36
        env:
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: node tools/ai-review/orchestrate.ts
      - name: Validate output before handing it to the posting job
        id: validate
        if: steps.review.outcome == 'success'
        env:
          GENERATION_ATTEMPT: ${{ steps.review.outputs.attempt }}
          PR_NUMBER: ${{ needs.gate.outputs.pr }}
          PR_HEAD: ${{ needs.gate.outputs.head }}
          PR_BASE: ${{ needs.gate.outputs.base }}
        run: '"$REVIEW_NODE" tools/ai-review/publish.ts validate'
      - uses: actions/upload-artifact@v7.0.2
        if: steps.review.outcome == 'success'
        with:
          name: ${{ steps.review.outputs.artifact }}
          path: |
            ${{ runner.temp }}/ai-review-material/result.json
            ${{ runner.temp }}/ai-review-material/metadata.json
            ${{ runner.temp }}/ai-review-material/plan.json
            ${{ runner.temp }}/ai-review-material/execution.json
            ${{ runner.temp }}/ai-review-material/budget-result.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve review cost record
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ai-review-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-review-material/budget.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Record incomplete execution
        if: failure()
        run: echo 'AIレビューは未完了です。認証・資料上限・モデル・出力形式の各ステップを確認してください。自動再試行は行いません。' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve check status
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ai-review-status-${{ github.run_id }}-${{ github.run_attempt }}-generate
          path: ${{ runner.temp }}/status.json
          if-no-files-found: ignore
          retention-days: 1

  publish:
    needs: [gate, generate]
    if: vars.AI_REVIEW_MODE == 'review' && needs.generate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    env:
      AI_REVIEW_JOB: publish
      GENERATION_ATTEMPT: ${{ needs.generate.outputs.attempt }}
      PR_NUMBER: ${{ needs.gate.outputs.pr }}
      PR_HEAD: ${{ needs.gate.outputs.head }}
      PR_BASE: ${{ needs.gate.outputs.base }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.generate.outputs.artifact }}
          path: ${{ runner.temp }}/ai-review-result
      - name: Recheck PR author and revision, then update the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_DIRECTORY: ${{ runner.temp }}/ai-review-result
        run: node tools/ai-review/publish.ts
      - name: Preserve check status
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ai-review-status-${{ github.run_id }}-${{ github.run_attempt }}-publish
          path: ${{ runner.temp }}/status.json
          if-no-files-found: ignore
          retention-days: 1
