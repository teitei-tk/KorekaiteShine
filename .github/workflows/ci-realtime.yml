name: Worker real-time checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect real-time test changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Detect relevant changes without path-list truncation
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/local-integration/src/ci-selection.ts >> "$GITHUB_OUTPUT"
  realtime:
    name: Full coverage, real-time retry and DLQ
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: flatt-security/setup-takumi-guard-npm@v1.4.0
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify Guard registry
        run: node tools/docs/check-guard.ts --registry-only
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate shared contracts
        run: pnpm --filter @korekaite/api-contracts generate
      - name: Measure all tests including real-time retry and DLQ
        run: pnpm test:coverage
      - name: Require all four metrics to reach 100 percent
        run: pnpm check:coverage
      - name: Show coverage suite failures
        if: failure()
        run: |
          shopt -s nullglob
          for log in coverage/runs/*/*.log; do
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done
  result:
    name: Realtime result
    needs: [changes, realtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Report independent real-time result
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DETECTION_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          TEST_RESULT: ${{ needs.realtime.result }}
        run: node tools/local-integration/src/ci-selection.ts result
