name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-lockfile:
    name: Verify Actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned verification tool
        run: gh extension install github/gh-actions-lock --pin v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify pinned Actions and their sources
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
  docs:
    name: Check formatting, links, and heading anchors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect documentation changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          # 比較元がない初回pushや履歴の取得不能時は検査を省略しない。
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fi
          git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/docs-changes"
          git diff --no-renames --name-only --diff-filter=D -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/docs-deletions"
          required=false
          # Markdown以外でも、削除・移動による相対リンク切れを検査する。
          if [[ -s "$RUNNER_TEMP/docs-deletions" ]]; then
            required=true
          fi
          while IFS= read -r -d '' file; do
            case "$file" in
              *.md|tools/docs/*|.github/workflows/*|package.json|*/package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.node-version|.markdownlint.json|.gitignore|*/.gitignore|.oxlintrc.json|.oxfmtrc.json)
                required=true ;;
            esac
          done < "$RUNNER_TEMP/docs-changes"
          echo "required=$required" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6.1.1
        if: steps.changes.outputs.required == 'true'
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        if: steps.changes.outputs.required == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install documentation check dependencies
        if: steps.changes.outputs.required == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check Node.js configuration
        if: steps.changes.outputs.required == 'true'
        run: pnpm check:node
      - name: Check documentation
        if: steps.changes.outputs.required == 'true'
        run: pnpm check:docs
  lint-format:
    name: Repository lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint repository with oxlint
        run: pnpm lint
      - name: Check repository formatting with oxfmt
        run: pnpm format:check
  apps:
    name: Apps checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate shared contracts
        run: pnpm --filter @korekaite/api-contracts generate
      - name: Build and typecheck apps
        run: pnpm --filter './apps/*' --workspace-concurrency=1 run typecheck
      - name: Test apps
        run: pnpm --filter './apps/*' --workspace-concurrency=1 run test
  packages:
    name: Packages checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate shared contracts
        run: pnpm --filter @korekaite/api-contracts generate
      - name: Build and typecheck packages
        run: pnpm --filter './packages/*' --workspace-concurrency=1 run typecheck
      - name: Test packages
        run: pnpm --filter './packages/*' --workspace-concurrency=1 run test
  tools:
    name: Tools checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate shared contracts
        run: pnpm --filter @korekaite/api-contracts generate
      - name: Build and typecheck tools
        run: pnpm --filter './tools/*' --filter '!@korekaite/local-integration' --workspace-concurrency=1 run typecheck
      - name: Test tools
        run: pnpm --filter './tools/*' --filter '!@korekaite/local-integration' --workspace-concurrency=1 run test
  local-boundaries:
    name: Local Worker boundaries (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate shared contracts
        run: pnpm --filter @korekaite/api-contracts generate
      - name: Typecheck local integration tooling
        run: pnpm --filter @korekaite/local-integration typecheck
      - name: Test Worker and D1 boundaries
        run: pnpm --filter @korekaite/local-integration test ${{ matrix.shard }} --maxWorkers=2
  local-integration:
    name: Local Worker integration (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate shared contracts
        run: pnpm --filter @korekaite/api-contracts generate
      - name: Prepare development retention sentinel
        run: pnpm prepare:integration
      - name: Test real-time Queue delivery and recovery
        run: pnpm --filter @korekaite/local-integration test:integration:pr ${{ matrix.shard }} --maxWorkers=2
