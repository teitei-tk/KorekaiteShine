name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-lockfile:
    name: Verify Actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned verification tool
        run: gh extension install github/gh-actions-lock --pin v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify pinned Actions and their sources
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
  docs:
    name: Check formatting, links, and heading anchors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect documentation changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          # 比較元がない初回pushや履歴の取得不能時は検査を省略しない。
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fi
          git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/docs-changes"
          git diff --no-renames --name-only --diff-filter=D -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/docs-deletions"
          required=false
          # Markdown以外でも、削除・移動による相対リンク切れを検査する。
          if [[ -s "$RUNNER_TEMP/docs-deletions" ]]; then
            required=true
          fi
          while IFS= read -r -d '' file; do
            case "$file" in
              *.md|tools/docs/*|.github/workflows/*|package.json|*/package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.node-version|.markdownlint.json|.gitignore|*/.gitignore|.oxlintrc.json|.oxfmtrc.json)
                required=true ;;
            esac
          done < "$RUNNER_TEMP/docs-changes"
          echo "required=$required" >> "$GITHUB_OUTPUT"
      - uses: flatt-security/setup-takumi-guard-npm@v1.4.0
        if: steps.changes.outputs.required == 'true'
      - uses: pnpm/action-setup@v6.1.1
        if: steps.changes.outputs.required == 'true'
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        if: steps.changes.outputs.required == 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify Guard registry
        if: steps.changes.outputs.required == 'true'
        run: node tools/docs/check-guard.ts --registry-only
      - name: Install documentation check dependencies
        if: steps.changes.outputs.required == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check Node.js configuration
        if: steps.changes.outputs.required == 'true'
        run: pnpm check:node
      - name: Check documentation
        if: steps.changes.outputs.required == 'true'
        run: pnpm check:docs
  lint-format:
    name: Repository lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: flatt-security/setup-takumi-guard-npm@v1.4.0
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node tools/docs/check-guard.ts --registry-only
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/docs/check-guard.ts
      - run: pnpm lint
      - run: pnpm format:check
  typecheck:
    name: Typecheck all workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: flatt-security/setup-takumi-guard-npm@v1.4.0
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node tools/docs/check-guard.ts --registry-only
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
  build:
    name: Build application and isolation tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: flatt-security/setup-takumi-guard-npm@v1.4.0
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node tools/docs/check-guard.ts --registry-only
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate contracts and route types
        run: pnpm prepare:checks
      - run: pnpm --filter korekaite-shine-web build:app
      - run: pnpm --filter korekaite-shine-ai-review build:isolation --outDir ../../.ci/isolation-build
  test-plan:
    name: Select and balance tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: flatt-security/setup-takumi-guard-npm@v1.4.0
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node tools/docs/check-guard.ts --registry-only
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate contracts and route types
        run: pnpm prepare:checks
      - name: Read timing history from a successful main push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p .ci
          # History is only an optimization. Missing history never removes tests.
          if run=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId') && [[ "$run" =~ ^[0-9]+$ ]]; then
            if gh run download "$run" --name "ci-history-$run" --dir .ci/prior; then
              cp .ci/prior/history.json .ci/history-input.json
            fi
          fi
      - name: Create test plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci/src/cli.ts plan
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/plan.json
            .ci/history-input.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  tests:
    name: Tests (${{ matrix.id }})
    needs: test-plan
    if: needs.test-plan.outputs.has_tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: flatt-security/setup-takumi-guard-npm@v1.4.0
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node tools/docs/check-guard.ts --registry-only
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate contracts and route types
        run: pnpm prepare:checks
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci
      - name: Prepare integration sentinel
        if: matrix.runnerClass == 'integration'
        run: pnpm prepare:integration
      - name: Prepare browser
        if: matrix.runnerClass == 'e2e'
        run: pnpm --filter @korekaite/e2e exec playwright install --with-deps chromium
      - name: Run selected tests
        env:
          SHARD_ID: ${{ matrix.id }}
        run: node tools/ci/src/cli.ts run "$SHARD_ID"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: .ci/results/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  ci-result:
    name: CI result
    if: always()
    needs: [verify-lockfile, docs, lint-format, typecheck, build, test-plan, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify required job states
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/ci/src/job-result.ts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci
      - uses: actions/download-artifact@v8.0.2
        if: needs.test-plan.outputs.has_tests == 'true'
        with:
          pattern: ci-result-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .ci/results
          merge-multiple: true
      - name: Verify complete test results
        run: node tools/ci/src/cli.ts result
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ci-history-${{ github.run_id }}
          path: .ci/history.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30
