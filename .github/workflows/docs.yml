name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-lockfile:
    name: Verify Actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned verification tool
        run: gh extension install github/gh-actions-lock --pin v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify pinned Actions and their sources
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
  docs:
    name: Check formatting, links, and heading anchors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install documentation check dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check Node.js configuration
        run: pnpm check:node
      - name: Check documentation tooling types
        run: pnpm --dir tools/docs typecheck
      - name: Test documentation tooling
        run: pnpm --dir tools/docs test
      - name: Check documentation
        run: pnpm check:docs
  ai-review-tooling:
    name: Repository lint, format and AI review checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint repository with oxlint
        run: pnpm lint
      - name: Check repository formatting with oxfmt
        run: pnpm format:check
      - name: Check AI review tooling types
        run: pnpm --dir tools/ai-review typecheck
      - name: Test AI review tooling
        run: pnpm --dir tools/ai-review test
