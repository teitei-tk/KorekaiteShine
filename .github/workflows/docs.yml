name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-lockfile:
    name: Verify Actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned verification tool
        run: gh extension install github/gh-actions-lock --pin v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify pinned Actions and their sources
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
  docs:
    name: Check formatting, links, and heading anchors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4.3.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install documentation check dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check configuration, types, tests, and documentation
        run: pnpm check
