name: 文書検査

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: 書式・リンク・見出しアンカー
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tools/docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: tools/docs/pnpm-lock.yaml
      - name: 文書検査の依存を導入
        run: pnpm --dir tools/docs install --frozen-lockfile --ignore-scripts
      - name: TypeScriptの型検査
        run: pnpm --dir tools/docs typecheck
      - name: リンク検査の回帰テスト
        run: pnpm --dir tools/docs test
      - name: 文書を検査
        run: pnpm --dir tools/docs check
