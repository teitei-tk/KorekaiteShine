x-runtime: &runtime
  image: ${DEV_IMAGE:-korekaite-dev:local}
  pull_policy: never
  init: true
  user: '1000:1000'
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  environment: &environment
    npm_config_registry: http://registry-proxy:3128/
    CI: 'true'
  tmpfs:
    - /tmp:exec,uid=1000,gid=1000,mode=1777
    - /work:exec,uid=1000,gid=1000,mode=0750
  entrypoint: [/bin/sh, /opt/containers/entrypoint.sh]

services:
  registry-proxy:
    <<: *runtime
    entrypoint: [node, /opt/containers/registry-proxy.mjs]
    networks: [fetch, outbound]
  deps:
    <<: *runtime
    depends_on: [registry-proxy]
    command: [deps]
    volumes:
      - '${CONTAINER_INPUT:?}:/input:ro'
      - dependencies:/store
    networks: [fetch]
  dev:
    <<: *runtime
    environment:
      <<: *environment
      KOREKAITE_CONTAINER_DEV: '1'
    command: [pnpm, dev:local]
    networks: [development]
    volumes:
      - '${CONTAINER_INPUT:?}:/input:ro'
      - dependencies:/store:ro
      - development-state:/work/.local
  web-port:
    <<: *runtime
    entrypoint: [socat, 'TCP-LISTEN:63286,fork,reuseaddr', 'TCP:dev:63286']
    depends_on: [dev]
    networks: [development, frontend]
    ports: ['127.0.0.1:${KOREKAITE_WEB_PORT:-63286}:63286']
  check:
    <<: *runtime
    command: [pnpm, check]
    network_mode: none
    volumes:
      - '${CONTAINER_INPUT:?}:/input:ro'
      - dependencies:/store:ro

networks:
  fetch:
    internal: true
  development:
    internal: true
  frontend: {}
  outbound: {}
volumes:
  dependencies: {}
  development-state: {}
