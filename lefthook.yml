# ルート共通設定で全体をlint・format確認する。自動修正・自動stageは行わない。
lefthook: pnpm exec lefthook

pre-commit:
  parallel: true
  commands:
    git-secrets:
      run: git secrets --pre_commit_hook
    lint:
      run: pnpm lint
    format:
      run: pnpm format:check
    test:
      run: pnpm test

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    format:
      run: pnpm format:check
    test:
      run: pnpm test
