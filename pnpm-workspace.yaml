packages:
  - 'apps/*'
  - 'tools/*'

# 新規公開から24時間待ち、条件を確認できない場合も拒否する。
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# 未審査の依存ビルドと、推移依存の不正な取得経路を拒否する。
strictDepBuilds: true
# Gitフックは pnpm hooks:install で明示的に登録する。
allowBuilds:
  lefthook: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustLockfile: false

# ローカル連携検証: Babelの旧semverを、provenanceのある版へ置換する。
overrides:
  '@babel/core>semver': '7.8.5'
  '@babel/helper-compilation-targets>semver': '7.8.5'
  # 1.66.0では開発時のWorker初期化が失敗するため、Voidの対応範囲内で固定。
  'void>@cloudflare/vite-plugin': '1.64.0'
